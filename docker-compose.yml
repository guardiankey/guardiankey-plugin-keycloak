services:
  keycloak:
    build: .
    image: keycloak-gk
    container_name: keycloak-gk
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    command: 
        start-dev 
    volumes:
      - keycloak-data:/opt/keycloak/data
volumes:
  keycloak-data: